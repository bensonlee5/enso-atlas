name: Refresh public NOAA forecasts
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: enso-atlas-noaa-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'bensonlee5/enso-atlas' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 verified
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 verified
        with:
          python-version: '3.12'
      - name: Install data-decoding dependencies
        run: python -m pip install --disable-pip-version-check -r ingestion/requirements.txt
      - name: Download and validate complete NOAA products
        run: python ingestion/refresh_bundle.py
      - name: Check mature forecasts against observed temperatures
        run: python ingestion/verify_forecasts.py --archive-dir dist/data/archive --output dist/data/verification.json
      - name: Hash the final public data bundle
        run: python ingestion/refresh_bundle.py --manifest-only
      - name: Commit only verified forecast data
        shell: bash
        run: |
          set -euo pipefail
          git add -- dist/data/cfs-weekly-raw-60days.json dist/data/cfs-weekly-anomalies.json dist/data/enso-observations.json dist/data/ensemble-percentiles.json dist/data/refresh-manifest.json dist/data/verification.json dist/data/archive
          if git diff --cached --quiet; then
            echo 'No forecast changes'
            exit 0
          fi
          python - <<'PY'
          import subprocess,re
          expected={'dist/data/cfs-weekly-raw-60days.json','dist/data/cfs-weekly-anomalies.json','dist/data/enso-observations.json','dist/data/ensemble-percentiles.json','dist/data/refresh-manifest.json','dist/data/verification.json','dist/data/archive/index.json'}
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert all(p in expected or re.fullmatch(r'dist/data/archive/[0-9]{10}\.json',p) for p in changed), 'Refusing unexpected staged path'
          PY
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh validated NOAA forecast data'
          git push origin HEAD:main
