name: Refresh public forecast storage
on:
  schedule:
    # UTC, away from the busiest top-of-hour period. Only 15:17 decodes CFS ensemble.
    - cron: '17 15 * * *'
    - cron: '17 3,9,21 * * *'
  push:
    branches: [main]
    paths: ['ingestion/**', '.github/workflows/refresh-weather.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily: CFS ensemble and all products; fast: preserve CFS ensemble'
        type: choice
        options: [daily, fast]
        default: daily
permissions:
  contents: read
concurrency:
  group: enso-atlas-forecast-storage-refresh
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'bensonlee5/enso-atlas' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.transfer.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # official v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # official v5
        with:
          python-version: '3.12'
      - name: Select daily or lightweight refresh
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          mode=daily
          if [ "$EVENT_NAME" = schedule ] && [ "$SCHEDULE" = '17 3,9,21 * * *' ]; then
            mode=fast
          elif [ "$EVENT_NAME" = workflow_dispatch ]; then
            mode=${REQUESTED_MODE:-daily}
          fi
          case "$mode" in daily|fast) ;; *) echo "Invalid refresh mode" >&2; exit 1 ;; esac
          echo "REFRESH_MODE=$mode" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/forecast-work/data"
      - name: Restore hash-verified last-good feed
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if [ "$REFRESH_MODE" = daily ]; then flags+=(--allow-bootstrap); fi
          python ingestion/publish_forecasts.py restore --data "$RUNNER_TEMP/forecast-work/data" --state "$RUNNER_TEMP/forecast-work/state.json" "${flags[@]}"
      - name: Install data-decoding dependencies (no upload identity in this job)
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes -r ingestion/requirements-actions.lock
      - name: Download, decode, and validate only changed products
        run: python ingestion/refresh_bundle.py --mode "$REFRESH_MODE" --output "$RUNNER_TEMP/forecast-work/data"
      - name: Validate bounded object manifest
        run: python ingestion/publish_forecasts.py validate --data "$RUNNER_TEMP/forecast-work/data"
      - name: Transfer validated data to the isolated publisher
        id: transfer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # official v4.6.2
        with:
          name: forecast-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/forecast-work/
          retention-days: 1
          if-no-files-found: error
          compression-level: 6
  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # official v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download this run's immutable validated artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # official v4.3.0
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: ${{ runner.temp }}/forecast-work
          merge-multiple: true
      - name: Validate transferred bytes before obtaining upload identity
        run: python3 ingestion/publish_forecasts.py validate --data "$RUNNER_TEMP/forecast-work/data"
      - name: Publish changed objects, atomically promote, and read back
        run: python3 ingestion/publish_forecasts.py publish --data "$RUNNER_TEMP/forecast-work/data" --state "$RUNNER_TEMP/forecast-work/state.json"
      - name: Verify every active stored object
        run: >-
          python3 ingestion/publish_forecasts.py restore
          --data "$RUNNER_TEMP/forecast-readback/data"
          --state "$RUNNER_TEMP/forecast-readback/state.json"
      - name: Record operator result
        if: always()
        run: |
          echo 'Forecast refresh result: ${{ job.status }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'On failure, the last valid public manifest remains active. Check the feed run dates and workflow logs.' >> "$GITHUB_STEP_SUMMARY"
          echo 'CFS ensemble: daily; raw CFS/AIFS discovery: four daily checks; intermediate artifact retention: 1 day.' >> "$GITHUB_STEP_SUMMARY"
